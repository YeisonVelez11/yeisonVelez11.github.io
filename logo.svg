<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" role="img" aria-label="Yeison Velez — Frontend Developer">
  <title>Yeison Velez — Frontend Developer</title>
  <defs>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6b4a1a"/>
      <stop offset="20%"  stop-color="#d29440"/>
      <stop offset="40%"  stop-color="#ffd897"/>
      <stop offset="50%"  stop-color="#fff8e7"/>
      <stop offset="60%"  stop-color="#ffd897"/>
      <stop offset="80%"  stop-color="#d29440"/>
      <stop offset="100%" stop-color="#6b4a1a"/>
    </linearGradient>
    <linearGradient id="bracket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#d29440"/>
      <stop offset="50%"  stop-color="#f5b754"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded dark panel (transparent if you remove this rect) -->
  <rect width="320" height="96" rx="18" fill="#0a0a0f"/>

  <!-- Opening bracket  < -->
  <g filter="url(#glow)">
    <path d="M 52 26 L 26 48 L 52 70"
          fill="none"
          stroke="url(#bracket)"
          stroke-width="4.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- YV monogram (italic serif, brass gradient) -->
  <text x="160" y="64"
        font-family="'Fraunces', Georgia, 'Times New Roman', serif"
        font-size="56"
        font-style="italic"
        font-weight="500"
        text-anchor="middle"
        letter-spacing="-1.2"
        fill="url(#brass)">YV</text>

  <!-- Self-closing tag  / -->
  <g filter="url(#glow)">
    <line x1="248" y1="72" x2="262" y2="24"
          stroke="url(#bracket)"
          stroke-width="4.5"
          stroke-linecap="round"/>
  </g>

  <!-- Closing bracket  > -->
  <g filter="url(#glow)">
    <path d="M 268 26 L 294 48 L 268 70"
          fill="none"
          stroke="url(#bracket)"
          stroke-width="4.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>

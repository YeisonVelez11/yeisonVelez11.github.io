<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="YV — Frontend Developer">
  <title>YV — Frontend Developer</title>
  <defs>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6b4a1a"/>
      <stop offset="20%"  stop-color="#d29440"/>
      <stop offset="40%"  stop-color="#ffd897"/>
      <stop offset="50%"  stop-color="#fff8e7"/>
      <stop offset="60%"  stop-color="#ffd897"/>
      <stop offset="80%"  stop-color="#d29440"/>
      <stop offset="100%" stop-color="#6b4a1a"/>
    </linearGradient>
    <linearGradient id="bracket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#d29440"/>
      <stop offset="50%"  stop-color="#f5b754"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
  </defs>

  <!-- Rounded dark tile -->
  <rect width="96" height="96" rx="20" fill="#0a0a0f"/>

  <!-- Top: code tag </> hint -->
  <path d="M 30 24 L 22 32 L 30 40"
        fill="none"
        stroke="url(#bracket)"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <line x1="44" y1="42" x2="52" y2="22"
        stroke="url(#bracket)"
        stroke-width="3"
        stroke-linecap="round"/>
  <path d="M 66 24 L 74 32 L 66 40"
        fill="none"
        stroke="url(#bracket)"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- YV monogram below -->
  <text x="48" y="78"
        font-family="'Fraunces', Georgia, 'Times New Roman', serif"
        font-size="40"
        font-style="italic"
        font-weight="500"
        text-anchor="middle"
        letter-spacing="-1"
        fill="url(#brass)">YV</text>
</svg>
